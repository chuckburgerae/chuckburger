<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F63469" />
  <meta name="description" content="Chuck Burger bilingual visual menu — Abu Dhabi." />
  <title>Chuck Burger | Visual Menu</title>

  <style>
    :root{
      --pink:#F63469;
      --pink-dark:#DB2858;
      --orange:#FFAF00;
      --cream:#FFF8F0;
      --white:#FFFFFF;
      --ink:#181316;
      --muted:#6F6268;
      --line:rgba(24,19,22,.10);
      --shadow:0 18px 55px rgba(57,25,36,.12);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "Noto Sans Arabic", sans-serif;
      background:
        radial-gradient(circle at 105% 4%, rgba(255,175,0,.28), transparent 22rem),
        radial-gradient(circle at -8% 20%, rgba(246,52,105,.18), transparent 24rem),
        radial-gradient(circle at 92% 62%, rgba(255,175,0,.16), transparent 22rem),
        radial-gradient(circle at 8% 88%, rgba(246,52,105,.14), transparent 18rem),
        linear-gradient(180deg, #FFF3F7 0%, #FFF6EE 46%, #FFF1F6 100%);
      color:var(--ink);
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    img,video{display:block;width:100%;height:100%;object-fit:cover}
    button{font:inherit}
    .shell{width:min(100%,760px);margin:auto;min-height:100vh;padding-bottom:28px}

    /* HERO */
    .hero{
      min-height:330px;
      position:relative;
      overflow:hidden;
      padding:24px 18px 30px;
      border-radius:0 0 42px 42px;
      background:var(--pink);
      color:white;
      isolation:isolate;
    }
    .hero:before{
      content:"";
      position:absolute;
      width:290px;height:290px;
      right:-115px;top:-95px;
      border:34px solid var(--orange);
      border-radius:50%;
      z-index:-1;
    }
    .hero:after{
      content:"";
      position:absolute;
      width:160px;height:160px;
      left:-80px;bottom:-75px;
      border-radius:50%;
      background:var(--orange);
      z-index:-1;
    }

    .brand-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .brand-logo{
      width:64px;height:64px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid rgba(255,255,255,.96);
      box-shadow:0 12px 32px rgba(70,16,35,.25);
      background:white;
    }
    .brand-en{
      font-size:21px;
      line-height:1;
      font-weight:1000;
      letter-spacing:.01em;
    }
    .brand-ar{
      margin-top:7px;
      direction:rtl;
      text-align:left;
      font-size:14px;
      font-weight:800;
      opacity:.9;
    }

    .top-social{
      margin-top:8px;
      display:flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
      font-size:10px;
      line-height:1;
      font-weight:800;
      color:rgba(255,255,255,.92);
    }
    .top-social span{
      opacity:.72;
      font-weight:700;
    }
    .visual-badge{
      flex:0 0 auto;
      border-radius:999px;
      padding:9px 12px;
      background:rgba(255,255,255,.13);
      border:1px solid rgba(255,255,255,.25);
      backdrop-filter:blur(10px);
      font-size:10px;
      font-weight:950;
      letter-spacing:.06em;
      text-transform:uppercase;
    }

    .hero-copy{margin-top:42px;max-width:590px}
    .hero-tag{
      display:inline-flex;
      padding:8px 12px;
      border-radius:999px;
      background:var(--orange);
      color:var(--ink);
      font-size:10px;
      font-weight:1000;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .hero h1{
      margin:15px 0 7px;
      font-size:clamp(38px,11vw,68px);
      line-height:.93;
      letter-spacing:-.05em;
      font-weight:1000;
    }
    .hero h2{
      margin:0;
      direction:rtl;
      text-align:left;
      font-size:clamp(25px,7.7vw,42px);
      line-height:1.05;
      font-weight:900;
    }
    .hero p{
      margin:15px 0 0;
      font-size:13px;
      line-height:1.65;
      color:rgba(255,255,255,.9);
      font-weight:600;
      max-width:510px;
    }
    .hero p .ar{
      display:block;
      direction:rtl;
      text-align:left;
      margin-top:3px;
    }

    /* SMALL STICKY GUIDE */
    .guide{
      position:sticky;
      top:0;
      z-index:20;
      padding:11px 14px 8px;
      background:linear-gradient(to bottom,rgba(255,243,247,.96),rgba(255,247,238,.90),rgba(255,247,238,0));
      backdrop-filter:blur(12px);
    }
    .guide-inner{
      display:flex;
      justify-content:center;
      gap:8px;
      width:max-content;
      max-width:100%;
      margin:auto;
      padding:8px 12px;
      border-radius:999px;
      background:linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,244,248,.92));
      border:1px solid rgba(246,52,105,.12);
      box-shadow:0 8px 22px rgba(35,21,26,.06);
      color:var(--muted);
      font-size:11px;
      font-weight:850;
    }
    .guide-inner b{color:var(--pink)}

    .intro{
      padding:18px 18px 4px;
    }
    .intro h3{
      margin:0;
      font-size:30px;
      line-height:1;
      font-weight:1000;
      letter-spacing:-.04em;
    }
    .intro .arabic-title{
      margin-top:7px;
      direction:rtl;
      text-align:left;
      font-size:20px;
      font-weight:900;
    }
    .intro p{
      margin:10px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
      font-weight:600;
    }
    .intro p .ar{
      display:block;
      direction:rtl;
      text-align:left;
      margin-top:2px;
    }


    .category-bar{
      display:flex;
      gap:7px;
      overflow-x:auto;
      scrollbar-width:none;
      padding:12px 14px 5px;
      -webkit-overflow-scrolling:touch;
    }
    .category-bar::-webkit-scrollbar{display:none}
    .category-btn{
      flex:0 0 auto;
      border:1px solid rgba(246,52,105,.10);
      background:linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,244,248,.92));
      color:var(--ink);
      border-radius:999px;
      padding:8px 11px;
      font-size:10px;
      line-height:1;
      font-weight:900;
      white-space:nowrap;
      cursor:pointer;
      box-shadow:0 6px 15px rgba(35,21,26,.05);
      transition:transform .18s ease, background .18s ease, color .18s ease;
    }

    .cat-emoji{
      display:inline-block;
      margin-right:5px;
      font-size:12px;
      line-height:1;
      vertical-align:-1px;
    }
    .category-btn[data-category="ورق عنب"] .cat-emoji{
      margin-right:4px;
      margin-left:2px;
    }

    .category-btn:active{transform:scale(.97)}
    .category-btn.active{
      background:var(--pink);
      color:white;
      border-color:var(--pink);
      box-shadow:0 7px 18px rgba(246,52,105,.20);
    }


    .empty-category{
      margin:6px 0 10px;
      min-height:170px;
      display:grid;
      place-items:center;
      text-align:center;
      padding:28px 20px;
      border:1px dashed rgba(246,52,105,.25);
      border-radius:26px;
      background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(255,239,245,.88));
      color:var(--muted);
    }
    .empty-category .empty-icon{font-size:35px;margin-bottom:8px}
    .empty-category strong{display:block;color:var(--ink);font-size:17px}
    .empty-category span{display:block;margin-top:6px;font-size:12px;direction:rtl}

    /* MEALS */
    .menu-list{
      display:grid;
      gap:19px;
      padding:14px 14px 20px;
    }
    .meal-card{
      overflow:hidden;
      background:linear-gradient(180deg, rgba(255,255,255,.96) 0%, rgba(255,247,250,.94) 100%);
      border:1px solid rgba(246,52,105,.10);
      border-radius:30px;
      box-shadow:var(--shadow);
      opacity:0;
      transform:translateY(18px);
      transition:opacity .5s ease, transform .55s cubic-bezier(.2,.75,.2,1);
    }
    .meal-card.visible{
      opacity:1;
      transform:translateY(0);
    }

    .media-stage{
      height:clamp(250px,68vw,395px);
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:6px;
      padding:6px;
      background:var(--ink);
    }
    .meal-card.reverse .media-stage{grid-template-columns:.95fr 1.05fr}
    .meal-card.reverse .photo-panel{order:2}
    .meal-card.reverse .video-panel{order:1}

    .media-panel{
      position:relative;
      overflow:hidden;
      min-width:0;
      border:0;
      padding:0;
      background:#2b2427;
      cursor:pointer;
    }
    .photo-panel{border-radius:23px 8px 8px 23px}
    .video-panel{border-radius:8px 23px 23px 8px}
    .meal-card.reverse .photo-panel{border-radius:8px 23px 23px 8px}
    .meal-card.reverse .video-panel{border-radius:23px 8px 8px 23px}

    .media-label{
      position:absolute;
      z-index:4;
      left:10px;
      top:10px;
      padding:7px 9px;
      border-radius:999px;
      background:rgba(255,255,255,.91);
      color:var(--ink);
      font-size:9px;
      font-weight:1000;
      letter-spacing:.07em;
      text-transform:uppercase;
      backdrop-filter:blur(8px);
    }
    .media-label.ar{
      left:auto;
      right:10px;
      direction:rtl;
    }

    .play-ui{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
      background:linear-gradient(to top,rgba(0,0,0,.18),transparent 44%);
    }
    .play-circle{
      width:48px;height:48px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:rgba(255,255,255,.91);
      color:var(--pink);
      font-size:18px;
      box-shadow:0 10px 30px rgba(0,0,0,.18);
      transition:.2s ease;
    }
    .video-panel.playing .play-circle{
      opacity:0;
      transform:scale(.8);
    }

    .video-missing{
      display:none;
      position:absolute;
      inset:0;
      place-items:center;
      text-align:center;
      padding:16px;
      color:white;
      background:
        radial-gradient(circle at 70% 18%,rgba(255,175,0,.72),transparent 42%),
        linear-gradient(145deg,var(--pink),#AF1745);
    }
    .video-missing strong{
      display:block;
      font-size:16px;
      line-height:1.05;
      margin-bottom:7px;
    }
    .video-missing span{
      display:block;
      font-size:10px;
      line-height:1.4;
      opacity:.85;
    }

    .meal-info{padding:17px 17px 18px}
    .meal-line{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
    }
    .meal-name-en{
      margin:0;
      font-size:24px;
      line-height:1.02;
      font-weight:1000;
      letter-spacing:-.035em;
    }
    .meal-name-ar{
      direction:rtl;
      text-align:left;
      margin-top:6px;
      font-size:17px;
      line-height:1.15;
      font-weight:900;
    }
    .price{
      flex:0 0 auto;
      min-width:76px;
      padding:10px 11px;
      border-radius:16px;
      background:var(--orange);
      color:var(--ink);
      text-align:center;
      box-shadow:0 9px 22px rgba(255,175,0,.24);
    }
    .price small{
      display:block;
      font-size:9px;
      font-weight:1000;
      letter-spacing:.08em;
    }
    .price b{
      display:block;
      font-size:21px;
      line-height:1;
      font-weight:1000;
    }

    .desc-en{
      margin:10px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
      font-weight:600;
    }
    .desc-ar{
      margin:5px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
      font-weight:650;
      direction:rtl;
      text-align:left;
    }

    /* lightbox */
    .lightbox{
      display:none;
      position:fixed;
      inset:0;
      z-index:100;
      place-items:center;
      padding:18px;
      background:rgba(14,9,12,.93);
      backdrop-filter:blur(12px);
    }
    .lightbox.open{display:grid}
    .lightbox img{
      width:min(100%,860px);
      height:auto;
      max-height:84vh;
      object-fit:contain;
      border-radius:24px;
      box-shadow:0 24px 80px rgba(0,0,0,.42);
    }
    .lightbox-close{
      position:fixed;
      right:18px;
      top:max(18px,env(safe-area-inset-top));
      width:44px;height:44px;
      border:0;
      border-radius:50%;
      background:white;
      color:var(--ink);
      font-size:20px;
      font-weight:1000;
      cursor:pointer;
    }

    footer{
      margin:7px 14px 0;
      padding:24px 18px 28px;
      border-radius:28px;
      background:var(--ink);
      color:white;
      text-align:center;
      overflow:hidden;
      position:relative;
    }
    footer:before{
      content:"";
      position:absolute;
      width:160px;height:160px;
      border-radius:50%;
      background:var(--pink);
      top:-92px;right:-70px;
      opacity:.85;
    }
    footer:after{
      content:"";
      position:absolute;
      width:120px;height:120px;
      border-radius:50%;
      background:var(--orange);
      bottom:-75px;left:-65px;
    }
    footer h4{
      margin:0;
      position:relative;
      z-index:1;
      font-size:25px;
      line-height:1.05;
      font-weight:1000;
    }
    footer .ar{
      position:relative;
      z-index:1;
      direction:rtl;
      margin-top:7px;
      font-size:17px;
      font-weight:850;
    }
    footer p{
      position:relative;
      z-index:1;
      margin:11px auto 0;
      max-width:470px;
      color:rgba(255,255,255,.68);
      font-size:11px;
      line-height:1.5;
    }

    @media(min-width:620px){
      .hero{padding:30px 28px 35px;min-height:370px}
      .intro{padding-left:24px;padding-right:24px}
      .menu-list{padding-left:20px;padding-right:20px}
      .meal-info{padding:20px 22px 22px}
      .meal-name-en{font-size:29px}
      .meal-name-ar{font-size:20px}
    }

    @media(max-width:390px){
      .brand-en{font-size:18px}
      .brand-ar{font-size:12px}
      .top-social{font-size:8px;gap:4px}
      .visual-badge{font-size:9px;padding:8px 9px}
      .media-stage{height:255px}
    }

    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*:before,*:after{transition:none!important;animation:none!important}
      .meal-card{opacity:1;transform:none}
    }
  </style>
</head>

    const menuList = document.getElementById("menuList");

    let activeCategory = "Burgers";

    function renderMenu(){
      const filteredMenu = MENU.filter(item => item.category === activeCategory);

      if(!filteredMenu.length){
        menuList.innerHTML = `
          <div class="empty-category">
            <div>
              <div class="empty-icon">🥤</div>
              <strong>Drinks will be added soon</strong>
              <span>المشروبات بتضاف قريباً</span>
            </div>
          </div>
        `;
        return;
      }

      menuList.innerHTML = filteredMenu.map((item,index)=>`
        <article class="meal-card ${index % 2 ? "reverse" : ""}">
          <div class="media-stage">
            <button class="media-panel photo-panel" type="button" aria-label="Open ${item.nameEn} photo">
              <span class="media-label">PHOTO</span>
              <img src="${item.photo}" alt="${item.nameEn}" loading="lazy">
            </button>

            <button class="media-panel video-panel" type="button" aria-label="Play ${item.nameEn} video">
              <span class="media-label">VIDEO</span>
              <video muted playsinline loop preload="metadata" poster="${item.photo}" data-src="${item.video}"></video>
              <div class="video-missing">
                <div>
                  <strong>Add your video</strong>
                  <span>${item.video}</span>
                </div>
              </div>
              <div class="play-ui"><span class="play-circle">▶</span></div>
            </button>
          </div>

          <div class="meal-info">
            <div class="meal-line">
              <div>
                <h3 class="meal-name-en">${item.nameEn}</h3>
                <div class="meal-name-ar">${item.nameAr}</div>
              </div>
              <div class="price">
                <small>AED</small>
                <b>${item.price}</b>
              </div>
            </div>

            <p class="desc-en">${item.descEn}</p>
            <p class="desc-ar">${item.descAr}</p>
          </div>
        </article>
      `).join("");

      attachPhotoEvents();
      attachVideoEvents();
      observeCards();
      observeVideos();
    }

    function attachPhotoEvents(){
      document.querySelectorAll(".photo-panel").forEach(panel=>{
        panel.addEventListener("click",()=>{
          const img=panel.querySelector("img");
          document.getElementById("lightboxImage").src=img.src;
          document.getElementById("lightbox").classList.add("open");
          document.getElementById("lightbox").setAttribute("aria-hidden","false");
        });
      });
    }

    function loadVideo(video,panel){
      if(video.src || panel.dataset.failed==="true") return;
      video.src=video.dataset.src;
      video.load();

      video.addEventListener("error",()=>{
        panel.dataset.failed="true";
        panel.querySelector(".video-missing").style.display="grid";
        panel.querySelector(".play-ui").style.display="none";
        video.style.display="none";
      },{once:true});
    }

    function attachVideoEvents(){
      document.querySelectorAll(".video-panel").forEach(panel=>{
        const video=panel.querySelector("video");
        panel.addEventListener("click",async()=>{
          loadVideo(video,panel);
          if(panel.dataset.failed==="true") return;

          try{
            if(video.paused){
              await video.play();
              panel.classList.add("playing");
            }else{
              video.pause();
              panel.classList.remove("playing");
            }
          }catch(_){}
        });
      });
    }

    function observeCards(){
      const observer=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
          if(entry.isIntersecting){
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
          }
        });
      },{threshold:.12});

      document.querySelectorAll(".meal-card").forEach(card=>observer.observe(card));
    }

    function observeVideos(){
      const observer=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
          const panel=entry.target;
          const video=panel.querySelector("video");

          if(entry.isIntersecting && entry.intersectionRatio>.58){
            loadVideo(video,panel);
            if(panel.dataset.failed!=="true"){
              video.play()
                .then(()=>panel.classList.add("playing"))
                .catch(()=>{});
            }
          }else{
            video.pause();
            panel.classList.remove("playing");
          }
        });
      },{threshold:[0,.58,1]});

      document.querySelectorAll(".video-panel").forEach(panel=>observer.observe(panel));
    }

    const lightbox=document.getElementById("lightbox");
    document.getElementById("lightboxClose").addEventListener("click",()=>{
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden","true");
    });
    lightbox.addEventListener("click",e=>{
      if(e.target===lightbox){
        lightbox.classList.remove("open");
        lightbox.setAttribute("aria-hidden","true");
      }
    });


    document.querySelectorAll(".category-btn").forEach(btn=>{
      btn.addEventListener("click",()=>{
        activeCategory = btn.dataset.category;

        document.querySelectorAll(".category-btn").forEach(b=>{
          b.classList.toggle("active", b === btn);
        });

        renderMenu();

        const menuTop = document.getElementById("menuList").getBoundingClientRect().top + window.scrollY - 65;
        window.scrollTo({top:menuTop, behavior:"smooth"});
      });
    });

    renderMenu();
  </script>
